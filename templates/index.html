<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GenAI Chat Assistant</title>

    <link rel="stylesheet" href="/static/styles.css">

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <div class="app-container">

        <!-- Header -->
        <header class="header">
            <div class="logo">🤖</div>

            <div>
                <h1>GenAI Chat Assistant</h1>
                <p>Your AI-powered voice and text assistant</p>
            </div>
        </header>

        <!-- Chat area -->
        <main id="chatContainer" class="chat-container">

            <!-- Welcome message -->
            <div class="message ai-message">
                <div class="avatar">🤖</div>

                <div class="message-content">
                    <div class="message-name">AI Assistant</div>

                    <div class="bubble">
                        <p>
                            Hello! 👋 I'm your GenAI Chat Assistant.
                        </p>

                        <p>
                            Ask me anything using text or your microphone.
                        </p>
                    </div>
                </div>
            </div>

        </main>

        <!-- Typing indicator -->
        <div id="typingIndicator" class="typing-indicator hidden">
            <span></span>
            <span></span>
            <span></span>
            <p>AI is thinking...</p>
        </div>

        <!-- Input area -->
        <section class="input-section">

            <div class="input-wrapper">

                <textarea
                    id="messageInput"
                    placeholder="Ask me anything..."
                    rows="1"
                    autocomplete="off"
                ></textarea>

                <!-- Voice button -->
                <button
                    id="voiceButton"
                    class="icon-button voice-button"
                    title="Speak"
                    type="button"
                >
                    🎤
                </button>

                <!-- Send button -->
                <button
                    id="sendButton"
                    class="send-button"
                    type="button"
                >
                    Send
                </button>

            </div>

            <div class="bottom-actions">

                <button
                    id="clearButton"
                    class="clear-button"
                    type="button"
                >
                    🗑️ Clear Chat
                </button>

                <span class="status">
                    Powered by Gemini
                </span>

            </div>

        </section>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
